services:
  postgres:
    image: postgres:18-alpine
    container_name: einerleih_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: einerleih
      POSTGRES_USER: einerleih
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - ./postgres_data_v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U einerleih -d einerleih"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate-reset:
    image: ${IMAGE_REF:-ghcr.io/narslan/einerleih:latest}
    container_name: einerleih_migrate_reset
    profiles: ["db-reset"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LISTEN: 0.0.0.0:8000
      PG__URL: postgres://einerleih:${POSTGRES_PASSWORD}@postgres:5432/einerleih
      ASSETS_PUBLIC_PATH: /app/static
      ASSETS_PUBLIC_URL: /static
      ASSETS_PRIVATE_PATH: /app/assets/private
      ASSETS_PRIVATE_URL: /file
      ASSET_MAX_SIZE: 5242880
    command: ["/app/einerleih", "migrate", "reset"]

  backend:
    image: ${IMAGE_REF:-ghcr.io/narslan/einerleih:latest}
    container_name: einerleih_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LISTEN: 0.0.0.0:8000
      PG__URL: postgres://einerleih:${POSTGRES_PASSWORD}@postgres:5432/einerleih
      ASSETS_PUBLIC_PATH: /app/static
      ASSETS_PUBLIC_URL: /static
      ASSETS_PRIVATE_PATH: /app/assets/private
      ASSETS_PRIVATE_URL: /file
      ASSET_MAX_SIZE: 5242880
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app_assets:/app/assets/private
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
volumes:
  app_assets:
